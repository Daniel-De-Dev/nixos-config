<!doctype html>
<html>
  <head>
    <meta charset="utf-8">

    <style>
      #pdf {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;

        border: 0;
      }

      #pdf.dark {
        filter: invert(1) contrast(0.96) brightness(0.92);
      }

      #mode-toggle {
        position: fixed;
        right: 2rem;
        bottom: 1rem;
        z-index: 10;

        padding: 0.5rem 1rem;

        color: white;
        background: #202020;

        border: 1px solid #404040;
        border-radius: 6px;

        font: inherit;
        cursor: pointer;
      }

      #mode-toggle:hover {
        background: #303030;
      }
    </style>
  </head>

  <body>
    <iframe id="pdf"></iframe>

    <button
      id="mode-toggle"
      type="button"
      aria-pressed="true"
    >
      Dark
    </button>

    <script src="viewer.js"></script>
  </body>
</html>
